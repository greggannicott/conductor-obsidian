name: Release Obsidian plugin

on:
    push:
        tags:
            - "*"

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v3

            - name: Use Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "18.x"

            - name: Build plugin
              run: |
                  npm install
                  npm run build

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    main.js manifest.json styles.css

            - name: Verify release assets
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  max_attempts=3
                  attempt=1

                  while [ "$attempt" -le "$max_attempts" ]; do
                    count=$(gh release view "$tag" --json assets -q '.assets | length')

                    if [ "$count" -ge 3 ]; then
                      echo "Release $tag has $count assets, all good."
                      exit 0
                    fi

                    echo "Attempt $attempt/$max_attempts: release $tag only has $count assets, re-uploading..."
                    gh release upload "$tag" main.js manifest.json styles.css --clobber

                    attempt=$((attempt + 1))
                  done

                  count=$(gh release view "$tag" --json assets -q '.assets | length')
                  if [ "$count" -ge 3 ]; then
                    echo "Release $tag has $count assets, all good."
                    exit 0
                  fi

                  echo "Failed to upload all release assets for $tag after $max_attempts attempts."
                  exit 1
